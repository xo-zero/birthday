<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>xo's Birthday</title>
    
    <!-- 仅保留 Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
         :root { --bg-pink: #fcecf1; --bg-dot: #fff; --window-bg: #fffcf8; --line-color: #c96b7b; --text-color: #b05a6a; }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background-color: var(--bg-pink); 
            background-image: radial-gradient(var(--bg-dot) 15%, transparent 16%), radial-gradient(var(--bg-dot) 15%, transparent 16%); 
            background-size: 40px 40px; background-position: 0 0, 20px 20px; 
            font-family: 'ZCOOL KuaiLe', cursive; 
            height: 100vh; height: 100dvh; 
            display: flex; justify-content: center; align-items: center; 
            overflow: hidden; 
        }
        
        .window-frame { 
            background-color: var(--window-bg); 
            width: 92vw; max-width: 1000px; 
            height: 90vh; height: 90dvh; 
            border-radius: 20px; 
            box-shadow: 0 15px 35px rgba(200, 150, 160, 0.3); 
            display: flex; flex-direction: column; 
            position: relative; overflow: hidden; 
        }
        
        .window-header { 
            height: 40px; border-bottom: 1px solid #f0e6e6; 
            display: flex; align-items: center; padding: 0 10px; 
            color: #d1b3b8; font-size: 12px; font-family: sans-serif; flex-shrink: 0; 
        }
        
        .header-address { 
            flex: 1; text-align: center; border: 1px solid #f0e6e6; 
            border-radius: 10px; margin: 0 10px; padding: 2px; 
            background: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; 
        }
        
        #home-view { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; transition: opacity 0.5s; }
        .illustration { width: 200px; height: 160px; margin-bottom: 20px; color: var(--line-color); }
        
        .title { 
            font-size: 2.2rem; color: var(--text-color); letter-spacing: 2px; 
            margin-bottom: 40px; display: flex; align-items: center; gap: 15px; 
        }
        
        .title::after { 
            content: ''; display: inline-block; width: 25px; height: 25px; 
            background: radial-gradient(circle at 30% 30%, #f9d8e0, #e6b8c4); 
            border-radius: 50%; box-shadow: 0 4px 6px rgba(0,0,0,0.05); 
        }
        
        .click-hint { position: absolute; bottom: 30px; font-size: 0.9rem; color: #d1b3b8; font-family: sans-serif; animation: pulse 2s infinite; }
        
        #gallery-view { flex: 1; display: none; flex-direction: column; padding: 15px; overflow-y: auto; background: #fffcf8; -webkit-overflow-scrolling: touch; }
        .gallery-actions { display: flex; justify-content: space-between; margin-bottom: 15px; gap: 10px; }
        
        .btn { 
            background-color: #fcecf1; color: var(--text-color); 
            border: 2px solid #f0d5db; padding: 8px 12px; 
            border-radius: 20px; font-family: inherit; font-size: 0.9rem; 
            cursor: pointer; transition: all 0.2s; white-space: nowrap; 
        }
        .btn:hover { background-color: #f0d5db; }
        .btn:disabled { opacity: 0.5; }
        
        /* 卡片容器与卡片样式 (确保绝对端正) */
        .cards-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 15px; padding-bottom: 20px; }
        .card { 
            background: #fff; 
            border: 2px dashed #e6b8c4; 
            border-radius: 15px; 
            padding: 15px; 
            box-shadow: 2px 4px 10px rgba(230, 184, 196, 0.2); 
            display: flex; flex-direction: column; gap: 10px; 
            /* 取消所有可能引起倾斜的样式 */
            transform: none; 
            animation: slideUp 0.5s ease-out; 
        }
        
        .card-header { display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; color: #888; border-bottom: 1px solid #f0f0f0; padding-bottom: 5px; }
        .card-content { font-size: 1rem; color: #333; line-height: 1.5; word-break: break-all; white-space: pre-wrap; }
        
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(5px); display: none; justify-content: center; align-items: flex-end; z-index: 100; }
        @media(min-width: 500px) { .modal-overlay { align-items: center; } }
        
        .modal { 
            background: #fff; padding: 25px 20px; 
            border-radius: 20px 20px 0 0; border: 2px solid #e6b8c4; 
            width: 100%; max-width: 500px; max-height: 90vh; 
            overflow-y: auto; box-shadow: 0 -10px 30px rgba(0,0,0,0.1); position: relative; 
        }
        @media(min-width: 500px) { .modal { border-radius: 20px; } }
        
        .modal h3 { margin-bottom: 15px; color: var(--text-color); text-align: center; font-size: 1.3rem; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; color: #666; font-size: 0.9rem; }
        
        .form-control { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 10px; font-family: inherit; font-size: 16px; }
        textarea.form-control { resize: none; min-height: 80px; }
        
        .radio-group { display: flex; gap: 10px; flex-direction: column; margin-top: 5px; }
        .radio-group label { display: flex; align-items: center; gap: 8px; margin: 0; font-size: 0.9rem; color: #333; padding: 8px; background: #fdf5f7; border-radius: 8px; }
        .close-btn { position: absolute; top: 15px; right: 15px; background: none; border: none; font-size: 1.5rem; cursor: pointer; color: #999; padding: 5px; }
        .passcode-input { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #ddd; margin-bottom: 10px; font-size: 16px;}
        
        #loading { display: none; text-align: center; color: #b05a6a; padding: 20px; font-size: 1rem;}
        @keyframes pulse { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div class="window-frame">
        <div class="window-header">
            <span>◁ ▷</span>
            <div class="header-address">xo's Birthday Room</div>
            <span>↻</span>
        </div>

        <div id="home-view" onclick="enterRoom()">
            <svg class="illustration" viewBox="0 0 200 150" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M40 40 Q50 20 60 40 Q60 55 50 60 Q40 55 40 40 Z" /><path d="M50 60 L50 80" />
                <path d="M150 30 L155 40 L165 42 L158 50 L160 60 L150 55 L140 60 L142 50 L135 42 L145 40 Z" stroke-width="1"/>
                <polyline points="30,80 100,40 170,80" />
                <line x1="50" y1="72" x2="50" y2="120" /><line x1="150" y1="72" x2="150" y2="120" />
                <line x1="30" y1="80" x2="30" y2="120" /><line x1="170" y1="80" x2="170" y2="120" />
                <rect x="85" y="95" width="30" height="20" rx="3" />
                <line x1="95" y1="85" x2="95" y2="95" /><line x1="105" y1="85" x2="105" y2="95" />
                <path d="M93 85 Q95 80 97 85" /><path d="M103 85 Q105 80 107 85" />
            </svg>
            <div class="title">xo's Birthday</div>
            <div class="click-hint">- 点击屏幕任意位置进入 -</div>
        </div>

        <div id="gallery-view">
            <div class="gallery-actions">
                <button class="btn" onclick="openForm()">✍️ 写下祝福</button>
                <div style="display: flex; gap: 8px;">
                    <button class="btn" onclick="openAdminView()">👑 xo查收</button>
                    <button class="btn" onclick="openMutualView()">🔑 口令查看</button>
                </div>
            </div>
            <div id="loading">正在加载祝福中... ✨</div>
            <div class="cards-container" id="cards-container"></div>
        </div>

        <!-- 写祝福弹窗 -->
        <div class="modal-overlay" id="form-modal">
            <div class="modal">
                <button class="close-btn" onclick="closeModal('form-modal')">×</button>
                <h3>给 xo 的祝福</h3>
                <div class="form-group">
                    <label>你的昵称</label>
                    <input type="text" id="input-name" class="form-control" placeholder="怎么称呼你？">
                </div>
                <div class="form-group">
                    <label style="display: flex; align-items: center; gap: 5px;">
                        <input type="checkbox" id="input-anonymous"> 匿名显示（隐藏昵称）
                    </label>
                </div>
                <div class="form-group">
                    <label>祝福内容</label>
                    <textarea id="input-content" class="form-control" placeholder="写下你想说的话..."></textarea>
                </div>
                <div class="form-group">
                    <label>隐私设置</label>
                    <div class="radio-group">
                        <label><input type="radio" name="visibility" value="public" checked> <b>公开</b>（所有人可见）</label>
                        <label><input type="radio" name="visibility" value="creator"> <b>仅 xo 可见</b>（私密信）</label>
                        <label><input type="radio" name="visibility" value="mutual"> <b>仅双方可见</b>（凭口令查看）</label>
                    </div>
                </div>
                <button class="btn" id="submit-btn" style="width: 100%; margin-top: 10px; padding: 12px; font-size: 1.1rem;" onclick="submitWish()">发送祝福 🎈</button>
            </div>
        </div>

        <!-- 管理员查看 -->
        <div class="modal-overlay" id="admin-modal">
            <div class="modal">
                <button class="close-btn" onclick="closeModal('admin-modal')">×</button>
                <h3>👑 xo 的专属收件箱</h3>
                <input type="password" id="admin-pass" class="passcode-input" placeholder="输入管理密码">
                <button class="btn" style="width: 100%; padding: 10px;" onclick="checkAdmin()">查看私密祝福</button>
                <div id="admin-cards" class="cards-container" style="margin-top: 20px; grid-template-columns: 1fr;"></div>
            </div>
        </div>

        <!-- 双方可见口令查看 -->
        <div class="modal-overlay" id="mutual-modal">
            <div class="modal">
                <button class="close-btn" onclick="closeModal('mutual-modal')">×</button>
                <h3>🔑 查看专属卡片</h3>
                <input type="text" id="mutual-pass" class="passcode-input" placeholder="输入你写信后得到的专属口令">
                <button class="btn" style="width: 100%; padding: 10px;" onclick="checkMutual()">解密查看</button>
                <div id="mutual-cards" class="cards-container" style="margin-top: 20px; grid-template-columns: 1fr;"></div>
            </div>
        </div>
    </div>

    <script>
        // ⚠️ 替换为你自己的 Supabase URL 和 KEY
        const SUPABASE_URL = 'https://comrcljxyjkmxqpbbyii.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_tQdnii6gyBA18oTsAbWDVA_8_wNPB9i';

        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        function enterRoom() {
            document.getElementById('home-view').style.display = 'none';
            document.getElementById('gallery-view').style.display = 'flex';
            loadPublicCards();
        }

        function openForm() { document.getElementById('form-modal').style.display = 'flex'; }
        function openAdminView() { document.getElementById('admin-modal').style.display = 'flex'; }
        function openMutualView() { document.getElementById('mutual-modal').style.display = 'flex'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }

        // 加载公开卡片
        async function loadPublicCards() {
            document.getElementById('loading').style.display = 'block';
            const { data, error } = await _supabase.from('wishes').select('*').eq('visibility', 'public').order('created_at', { ascending: false });
            document.getElementById('loading').style.display = 'none';
            
            if (error) { console.error(error); return; }

            const container = document.getElementById('cards-container');
            container.innerHTML = '';
            data.forEach(wish => { container.innerHTML += generateCardHTML(wish); });
        }

        // 生成卡片HTML (纯净版，无图片，无倾斜)
        function generateCardHTML(wish) {
            const displayName = wish.is_anonymous ? '匿名' : (wish.name || '神秘人');
            const date = new Date(wish.created_at).toLocaleDateString();
            return `
                <div class="card">
                    <div class="card-header">
                        <span>✨ ${displayName}</span>
                        <span>${date}</span>
                    </div>
                    <div class="card-content">${wish.content}</div>
                </div>
            `;
        }

        // 提交祝福 (无照片，极速秒发)
        async function submitWish() {
            const btn = document.getElementById('submit-btn');
            const name = document.getElementById('input-name').value.trim();
            const isAnonymous = document.getElementById('input-anonymous').checked;
            const content = document.getElementById('input-content').value.trim();
            const visibility = document.querySelector('input[name="visibility"]:checked').value;

            if (!content) return alert('祝福内容不能为空哦！');

            btn.disabled = true;
            btn.innerText = '发送中...';
            const mutualCode = Math.random().toString(36).substring(2, 8).toUpperCase();

            try {
                const { error: dbError } = await _supabase.from('wishes').insert([{
                    name: isAnonymous ? null : name,
                    is_anonymous: isAnonymous,
                    content: content,
                    visibility: visibility,
                    mutual_code: visibility === 'mutual' ? mutualCode : null
                }]);

                if (dbError) throw dbError;

                if (visibility === 'mutual') {
                    alert(`祝福已发送！请记住你的专属查看口令：\n\n【 ${mutualCode} 】\n\n以后xo和你只能凭此口令查看这条祝福。`);
                } else {
                    alert('祝福发送成功！🎉');
                }

                // 清空表单并关闭
                document.getElementById('input-name').value = '';
                document.getElementById('input-anonymous').checked = false;
                document.getElementById('input-content').value = '';
                closeModal('form-modal');
                
                // 如果是公开的，刷新页面列表
                if(visibility === 'public') loadPublicCards();

            } catch (error) {
                console.error(error);
                alert('发送失败，请检查网络或重试！');
            } finally {
                btn.disabled = false;
                btn.innerText = '发送祝福 🎈';
            }
        }

        // 查收私密祝福
        async function checkAdmin() {
            const pass = document.getElementById('admin-pass').value;
            const container = document.getElementById('admin-cards');
            container.innerHTML = '<p style="text-align:center;">查询中...</p>';
            
            const { data, error } = await _supabase.rpc('get_creator_wishes', { p_password: pass });

            if (error || !data || data.length === 0) {
                container.innerHTML = '<p style="color:#999;text-align:center;">密码错误，或暂时没有私密祝福。</p>';
                return;
            }
            container.innerHTML = '';
            data.forEach(wish => { container.innerHTML += generateCardHTML(wish); });
        }

        // 查收双方祝福
        async function checkMutual() {
            const code = document.getElementById('mutual-pass').value.trim().toUpperCase();
            const container = document.getElementById('mutual-cards');
            container.innerHTML = '<p style="text-align:center;">查询中...</p>';
            
            const { data, error } = await _supabase.rpc('get_mutual_wish', { p_code: code });

            if (error || !data || data.length === 0) {
                container.innerHTML = '<p style="color:#999;text-align:center;">口令错误，或未找到对应卡片。</p>';
                return;
            }
            container.innerHTML = '';
            data.forEach(wish => { container.innerHTML += generateCardHTML(wish); });
        }
    </script>
</body>
</html>
